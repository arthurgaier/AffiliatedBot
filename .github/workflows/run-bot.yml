name: run-bot

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_TOKEN_ENCRYPTION_KEY: ${{ secrets.ML_TOKEN_ENCRYPTION_KEY }}
          ML_AFFILIATE_MATT_WORD: ${{ vars.ML_AFFILIATE_MATT_WORD }}
          ML_AFFILIATE_MATT_TOOL: ${{ vars.ML_AFFILIATE_MATT_TOOL }}
      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/ml-token.enc
          git diff --cached --quiet || git commit -m "chore(data): atualiza estado do bot"
          git push
